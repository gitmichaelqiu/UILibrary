{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
  <script>
    (function() {
      var lockY, rafId;

      document.addEventListener('click', function(ev) {
        if (ev.target.closest('[data-md-component="palette"]')) {
          lockY = window.scrollY;
        }
      }, true);

      function forceScroll() {
        window.scrollTo(0, lockY);
        rafId = requestAnimationFrame(forceScroll);
      }

      new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          if (m.attributeName !== 'data-md-color-switching') return;
          if (document.body.hasAttribute('data-md-color-switching')) {
            if (rafId == null) {
              lockY = window.scrollY;
              rafId = requestAnimationFrame(forceScroll);
            }
          } else {
            window.scrollTo(0, lockY);
            if (rafId != null) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }
        });
      }).observe(document.body, { attributes: true, attributeFilter: ['data-md-color-switching'] });
    })();
  </script>
{% endblock %}

{% block footer %}
  {{ super() }}
  <div class="md-footer-klein-banner">
    <div class="md-footer-klein-banner__inner md-grid">
      <div class="md-footer-klein-banner__text">{{ config.site_name }}</div>
    </div>
  </div>
{% endblock %}
